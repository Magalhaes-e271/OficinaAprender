name: API e PostgreSQL

on:
  push:
    branches: [master, 'codex/**']
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: oficina_aprender_test
          POSTGRES_USER: oficina_user
          POSTGRES_PASSWORD: oficina_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U oficina_user -d oficina_aprender_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/oficina_aprender_test
      TEST_DATABASE_USERNAME: oficina_user
      TEST_DATABASE_PASSWORD: oficina_test
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: oficina_user
      PGPASSWORD: oficina_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Compilar e testar com PostgreSQL real
        run: bash gradlew --no-daemon clean test bootJar
      - name: Conferir retenção de arquivos e sessão após reinício
        run: python3 scripts/testar_reinicio.py
      - name: Ensaiar backup e restauração
        run: |
          docker exec "${{ job.services.postgres.id }}" pg_dump -U oficina_user -d oficina_aprender_test -Fc > build/backup-teste.dump
          docker exec "${{ job.services.postgres.id }}" createdb -U oficina_user oficina_restore_test
          docker exec -i "${{ job.services.postgres.id }}" pg_restore -U oficina_user --exit-on-error -d oficina_restore_test < build/backup-teste.dump
          docker exec "${{ job.services.postgres.id }}" psql -U oficina_user -d oficina_restore_test -v ON_ERROR_STOP=1 -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT 1 FROM arquivo WHERE tamanho > 0) THEN RAISE EXCEPTION 'Arquivo de teste ausente na restauração'; END IF; END \$\$;"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verificacao-api
          path: |
            build/reports/tests/test
            build/test-results/test
            build/reinicio.json
            build/reinicio.log
          retention-days: 14
